<!doctype html><html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
 :root{--quartz:#F6F4FC;--ink:#1C1826;--slate:#5E5777;--lav:#7C6FE8;--coral:#F2A65A;--mono:'SFMono-Regular',ui-monospace,Menlo,monospace;}
 *{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;}
 html,body{width:100%;height:100%;}
 .fg{width:100%;height:100%;position:relative;overflow:hidden;display:flex;align-items:center;
   background:radial-gradient(90% 130% at 88% 50%, #E7E2FB 0%, var(--quartz) 60%);
   font-family:'Pretendard Variable',sans-serif;color:var(--ink);padding:0 64px;}
 .left{max-width:600px;}
 .logo{display:flex;align-items:center;gap:14px;}
 .dots{width:44px;height:44px;background:var(--lav);border-radius:11px;display:grid;grid-template-columns:repeat(3,1fr);gap:4.5px;padding:8px;}
 .dots i{background:#fff;border-radius:50%;} .dots i:last-child{background:var(--coral);}
 .wm{font-weight:800;font-size:26px;letter-spacing:-.02em;}
 .eyebrow{font-family:var(--mono);font-size:14px;letter-spacing:.2em;color:var(--slate);margin-top:26px;font-weight:600;}
 h1{margin-top:8px;line-height:1.02;letter-spacing:-.035em;font-size:60px;}
 h1 .b{font-weight:800;} h1 .t{font-weight:200;}
 h1 .dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--coral);margin-left:5px;}
 .sub{margin-top:16px;font-size:22px;color:var(--slate);font-weight:500;max-width:520px;word-break:keep-all;}
 .phone{position:absolute;right:70px;top:64px;width:290px;height:520px;background:#fff;border-radius:36px;border:7px solid #fff;
   box-shadow:0 30px 70px rgba(124,111,232,.3);transform:rotate(5deg);overflow:hidden;}
 .screen{width:100%;height:100%;background:var(--quartz);padding:26px 20px;}
 .g{font-weight:800;font-size:24px;}
 .l{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--slate);margin-top:18px;}
 .card{margin-top:10px;background:#fff;border:1px solid #E4DFF4;border-radius:16px;padding:18px 20px;}
 .card .n{font-weight:800;font-size:56px;color:var(--lav);letter-spacing:-.03em;line-height:1;}
 .card .n small{font-size:22px;color:var(--ink);}
 .bar{height:8px;background:#EAE7FB;border-radius:99px;margin-top:14px;overflow:hidden;}
 .bar i{display:block;height:100%;width:60%;background:var(--lav);border-radius:99px;}
</style></head>
<body><div class="fg">
  <div class="left">
    <div class="logo"><div class="dots"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><div class="wm">Memsum</div></div>
    <div class="eyebrow">스크린샷 정리 · 캘린더 자동 · 주간 요약</div>
    <h1><span class="b">찍기만 하세요.</span> <span class="t">Memsum이 알아서.<span class="dot"></span></span></h1>
    <div class="sub">쌓이기만 하던 스크린샷을 읽어 정리하고, 일정은 캘린더에, 한 주는 5줄로.</div>
  </div>
  <div class="phone"><div class="screen">
    <div class="g">안녕하세요</div>
    <div class="l">THIS WEEK</div>
    <div class="card"><div class="n">24<small>장</small></div><div class="bar"><i></i></div></div>
  </div></div>
</div></body></html>
